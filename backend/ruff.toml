target-version = "py312"
line-length = 100
# Generated by Django; keep them byte-for-byte as makemigrations wrote them.
extend-exclude = ["**/migrations/*"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # django
    "C4",  # comprehensions
    "SIM", # simplify
    "PT",  # pytest style
    "RUF", # ruff-specific
]
ignore = [
    "RUF012", # flags idiomatic Django class attributes (Meta.constraints, REQUIRED_FIELDS, ...)
]

[lint.per-file-ignores]
"config/settings/*" = ["F405"]

[lint.isort]
known-first-party = ["apps", "common", "config"]
